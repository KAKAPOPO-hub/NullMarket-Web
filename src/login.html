<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NullMarket</title>
    <link rel="stylesheet" href="./output.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 to-emerald-100 flex flex-col items-center justify-start pt-10 px-4">

    <!-- Logo -->
    <div class="mb-8">
        <h1 class="text-4xl font-bold text-emerald-500" style="font-family: Georgia, serif; letter-spacing: -1px;">NullMarket</h1>
    </div>

    <!-- Wrapper -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 relative z-10">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-gray-900">Masuk ke NullMarket</h2>
            <a href="regis.html" class="text-emerald-500 font-semibold text-sm hover:underline">Daftar</a>
        </div>

        <!-- Form -->
        <form id="login-form" class="flex flex-col gap-5">

            <!-- Email -->
            <div class="relative border border-gray-300 rounded-md px-3 pt-5 pb-2 focus-within:border-emerald-500 transition-colors">
                <label class="absolute top-1.5 left-3 text-xs text-gray-400">Email</label>
                <input id="email" type="email" placeholder="Contoh: nama@email.com"
                       class="w-full text-sm text-gray-900 outline-none bg-transparent border-0 ring-0 focus:ring-0 focus:outline-none" />
            </div>

            <!-- Password -->
            <div class="relative border border-gray-300 rounded-md px-3 pt-5 pb-2 focus-within:border-emerald-500 transition-colors">
                <label class="absolute top-1.5 left-3 text-xs text-gray-400">Password</label>
                <input id="password" type="password" placeholder="Masukkan password"
                       class="w-full text-sm text-gray-900 outline-none bg-transparent border-0 ring-0 focus:ring-0 focus:outline-none" />
            </div>

            <!-- Butuh bantuan -->
            <div class="flex justify-end -mt-2">
                <a href="#" class="text-emerald-600 font-bold text-sm hover:underline">Butuh bantuan?</a>
            </div>

            <!-- Tombol masuk -->
            <button type="submit"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition-all text-white font-bold py-3 rounded-xl text-sm">
                Masuk
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-3">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-xs text-gray-400">atau masuk dengan</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <!-- Google -->
            <button type="button" class="w-full border border-gray-200 hover:bg-gray-50 active:scale-95 transition-all py-3 rounded-xl text-sm font-medium text-gray-700 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google
            </button>

            <!-- TikTok -->
            <button type="button" class="w-full border border-gray-200 hover:bg-gray-50 active:scale-95 transition-all py-3 rounded-xl text-sm font-medium text-gray-700 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z"/>
                </svg>
                Masuk dengan TikTok
            </button>

        </form>
    </div>

    <script src="../js/logres.js"></script>
</body>
</html>
