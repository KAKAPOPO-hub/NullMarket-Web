<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran - NullMarket</title>
    <link rel="stylesheet" href="./output.css" />
</head>
<body class="bg-gray-50 font-geist min-h-screen">
    <header class="w-full fixed top-0 z-50 bg-white border-b border-gray-200 shadow-sm transition-all duration-300 ease-in-out">
        <div class="w-full px-6 py-3 grid grid-cols-12 items-center gap-4">
            <div class="col-span-2 flex items-center">
                <h1 class="text-2xl font-bold text-emerald-600">NullMarket</h1>
            </div>
            <div class="col-span-7 flex items-center gap-4">
                <div class="relative" id="kategori-menu">
                    <button
                        onclick="toggleDropdown('kategori-dropdown')"
                        class="flex items-center gap-1 text-sm font-medium text-gray-600 hover:text-emerald-700 cursor-pointer whitespace-nowrap transition-colors"
                    >
                        <span>Kategori</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" fill-rule="evenodd" d="M4.47 9.4a.75.75 0 0 1 1.06 0l6.364 6.364a.25.25 0 0 0 .354 0L18.612 9.4a.75.75 0 0 1 1.06 1.06l-6.364 6.364a1.75 1.75 0 0 1-2.475 0L4.47 10.46a.75.75 0 0 1 0-1.06" />
                        </svg>
                    </button>
                    <div id="kategori-dropdown" class="hidden absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden z-50">
                        <a
                            onclick="filterKategori('semua')"
                            class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-emerald-600 transition-colors flex items-center gap-2 cursor-pointer"
                        >
                            Semua
                        </a>
                        <a
                            onclick="filterKategori('sayur')"
                            class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-emerald-600 transition-colors flex items-center gap-2 border-t border-gray-100 cursor-pointer"
                        >
                            Sayuran
                        </a>
                        <a
                            onclick="filterKategori('buah')"
                            class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-emerald-600 transition-colors flex items-center gap-2 border-t border-gray-100 cursor-pointer"
                        >
                            Buah-buahan
                        </a>
                        <a
                            onclick="filterKategori('frozen_food')"
                            class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-emerald-600 transition-colors flex items-center gap-2 border-t border-gray-100 cursor-pointer"
                        >
                            Frozen Food
                        </a>
                        <a
                            onclick="filterKategori('dairy')"
                            class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-emerald-600 transition-colors flex items-center gap-2 border-t border-gray-100 cursor-pointer"
                        >
                            Dairy & Bahan Pokok
                        </a>
                        <a
                            onclick="filterKategori('meat')"
                            class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-emerald-600 transition-colors flex items-center gap-2 border-t border-gray-100 cursor-pointer"
                        >
                            Daging & Ikan
                        </a>
                    </div>
                </div>
                <input
                    id="product-search-input"
                    type="text"
                    placeholder="Cari barang..."
                    class="flex-1 px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-lg outline-none focus:border-emerald-600 focus:bg-white text-gray-800 transition-colors"
                />
            </div>
            <div class="col-span-3 flex items-center justify-end gap-4 mr-5">
                <a class="hover:text-emerald-600 transition-colors text-gray-800 cursor-pointer" href="cart.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z" />
                    </svg>
                </a>
                <a href="#" class="hover:text-emerald-600 transition-colors text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="currentColor" d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h16q.825 0 1.413.588T22 6v12q0 .825-.587 1.413T20 20zM20 8l-7.475 4.675q-.125.075-.262.113t-.263.037t-.262-.037t-.263-.113L4 8v10h16zm-8 3l8-5H4zM4 8v.25v-1.475v.025V6v.8v-.012V8.25zv10z" />
                    </svg>
                </a>
                <a href="#" class="hover:text-emerald-600 transition-colors text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="w-6 h-6" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="currentColor" d="M10 21h4c0 1.1-.9 2-2 2s-2-.9-2-2m11-2v1H3v-1l2-2v-6c0-3.1 2-5.8 5-6.7V4c0-1.1.9-2 2-2s2 .9 2 2v.3c3 .9 5 3.6 5 6.7v6zm-4-8c0-2.8-2.2-5-5-5s-5 2.2-5 5v7h10z" />
                    </svg>
                </a>
                <div class="w-px h-6 bg-gray-300"></div>
                <div class="relative" id="user-menu">
                    <button
                        onclick="toggleDropdown('user-dropdown')"
                        class="hover:text-emerald-600 transition-colors text-gray-800 cursor-pointer"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="w-6 h-6" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" fill-rule="evenodd" d="M8 7a4 4 0 1 1 8 0a4 4 0 0 1-8 0m0 6a5 5 0 0 0-5 5a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3a5 5 0 0 0-5-5z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden z-50">
                        <button onclick="window.location.href='riwayat.html'" class="px-4 py-3 text-sm text-gray-700 hover:bg-emerald-50 transition-colors flex items-center gap-2 w-full text-left">Riwayat</button>
                        <button
                            onclick="logout()"
                            class="px-4 py-3 text-sm text-red-500 hover:bg-red-50 transition-colors flex items-center gap-2 w-full text-left"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-28 pb-16">
        <div class="max-w-7xl mx-auto px-6">
            <div class="grid gap-8 lg:grid-cols-[1.4fr_0.9fr]">
                <section class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm">
                    <h2 class="text-2xl font-bold text-gray-900 mb-4">Data Pengiriman</h2>
                    <form id="payment-form" class="space-y-5">
                        <div>
                            <label for="sender-name" class="block text-sm font-semibold text-gray-700 mb-2">Nama Pengirim</label>
                            <input
                                id="sender-name"
                                name="senderName"
                                type="text"
                                placeholder="Masukkan nama pengirim"
                                class="w-full rounded-md border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 focus:border-emerald-500 focus:outline-none"
                                required
                            />
                        </div>
                        <div>
                            <label for="shipping-address" class="block text-sm font-semibold text-gray-700 mb-2">Alamat Pengiriman</label>
                            <textarea
                                id="shipping-address"
                                name="shippingAddress"
                                rows="4"
                                placeholder="Masukkan alamat lengkap"
                                class="w-full rounded-md border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 focus:border-emerald-500 focus:outline-none"
                                required
                            ></textarea>
                        </div>
                        <div>
                            <span class="block text-sm font-semibold text-gray-700 mb-2">Metode Pembayaran</span>
                            <div class="space-y-2 rounded-xl border border-gray-200 overflow-hidden bg-white">
                                <label class="flex items-center justify-between gap-3 px-4 py-4 cursor-pointer border-b border-gray-200 hover:bg-emerald-50 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="GoPay"
                                            class="h-4 w-4 text-emerald-600"
                                            required
                                        />
                                        <span class="text-sm font-semibold text-gray-900">GoPay</span>
                                    </div>
                                </label>
                                <label class="flex items-center justify-between gap-3 px-4 py-4 cursor-pointer border-b border-gray-200 hover:bg-emerald-50 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="Dana"
                                            class="h-4 w-4 text-emerald-600"
                                        />
                                        <span class="text-sm font-semibold text-gray-900">DANA</span>
                                    </div>
                                </label>
                                <label class="flex items-center justify-between gap-3 px-4 py-4 cursor-pointer border-b border-gray-200 hover:bg-emerald-50 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="Kartu Kredit / Debit"
                                            class="h-4 w-4 text-emerald-600"
                                        />
                                        <span class="text-sm font-semibold text-gray-900">Kartu Kredit / Debit</span>
                                    </div>
                                </label>
                                <label class="flex items-center justify-between gap-3 px-4 py-4 cursor-pointer border-b border-gray-200 hover:bg-emerald-50 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="Kredivo Express"
                                            class="h-4 w-4 text-emerald-600"
                                        />
                                        <span class="text-sm font-semibold text-gray-900">Kredivo Express</span>
                                    </div>
                                </label>
                                <label class="flex items-center justify-between gap-3 px-4 py-4 cursor-pointer hover:bg-emerald-50 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="Debit Instan"
                                            class="h-4 w-4 text-emerald-600"
                                        />
                                        <span class="text-sm font-semibold text-gray-900">Debit Instan</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                        <button
                            type="submit"
                            class="w-full rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-700 transition-colors"
                        >
                            Checkout Sekarang
                        </button>
                    </form>
                </section>

                <aside class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm">
                    <h2 class="text-lg font-bold text-gray-900 mb-4">Ringkasan Pesanan</h2>
                    <div id="payment-summary" class="space-y-4 text-sm text-gray-700"></div>
                </aside>
            </div>
        </div>
    </main>

    <script src="../js/product.js"></script>
    <script src="../js/logres.js"></script>
    <script src="../js/payment.js"></script>
</body>
</html>
