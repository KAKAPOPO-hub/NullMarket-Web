<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan</title>
    <link rel="stylesheet" href="./output.css" />
</head>
<body class="font-geist bg-gray-50 text-gray-900">
  <main class="min-h-screen px-4 py-8 md:px-10 md:py-12">
    <div class="mx-auto w-full max-w-6xl">
      <header class="mb-8 rounded-3xl border border-gray-200 bg-white p-6 shadow-sm">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-emerald-600">Riwayat</p>
            <h1 class="mt-2 text-3xl font-black text-slate-900">Riwayat Pesanan Saya</h1>
            <p class="mt-2 max-w-2xl text-sm text-gray-600">Lihat semua pesanan yang sudah kamu buat. Ketuk detail pesanan untuk mengingat kembali ringkasan belanjaanmu.</p>
          </div>
          <div class="flex items-center gap-3">
            <a href="home.html" class="inline-flex items-center rounded-2xl border border-gray-300 bg-white px-4 py-3 text-sm font-semibold text-gray-700 transition hover:border-emerald-400 hover:text-emerald-600 hover:shadow-sm">
              ← Kembali ke Home
            </a>
          </div>
        </div>
      </header>

      

      <section id="user-riwayat" class="space-y-4"></section>

      <!-- Image modal -->
      <div id="riwayat-image-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
        <div class="max-w-3xl w-full px-4">
          <div class="bg-white rounded-2xl overflow-hidden">
            <div class="flex justify-end p-3">
              <button id="riwayat-modal-close" class="rounded-full bg-gray-100 p-2 hover:bg-gray-200">✕</button>
            </div>
            <div class="p-4 flex items-center justify-center">
              <img id="riwayat-modal-img" src="" alt="Foto pesanan" class="max-h-[70vh] object-contain" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/riwayat.js"></script>
</body>
</html>
